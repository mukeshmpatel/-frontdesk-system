limit_req_zone $binary_remote_addr zone=aaiq_sms_webhook:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=aaiq_login:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name aaiq.wyndhamgardensalina.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aaiq.wyndhamgardensalina.net;

    ssl_certificate /etc/letsencrypt/live/aaiq.wyndhamgardensalina.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aaiq.wyndhamgardensalina.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AAIQ_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 15s;
    send_timeout 15s;
    client_max_body_size 15M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(self)" always;

    location = /api/v1/auth/login {
        limit_req zone=aaiq_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:4010;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/v1/sms/webhook {
        limit_req zone=aaiq_sms_webhook burst=20 nodelay;
        proxy_pass http://127.0.0.1:4010;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/v1/realtime {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
    }

    location / {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
