services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aaiq
      POSTGRES_USER: aaiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - aaiq_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aaiq -d aaiq"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - aaiq_redis:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgbouncer:
    build: ./docker/pgbouncer
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:6432:6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U aaiq -d aaiq"]
      interval: 5s
      timeout: 5s
      retries: 20

  realtime-os:
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://aaiq:${POSTGRES_PASSWORD}@pgbouncer:6432/aaiq?pgbouncer=true&connection_limit=20
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: 4010
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://aaiq.wyndhamgardensalina.net}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      ROOM_TELEMETRY_API_KEY: ${ROOM_TELEMETRY_API_KEY:?ROOM_TELEMETRY_API_KEY is required}
      HVAC_GATEWAY_URL: ${HVAC_GATEWAY_URL:-}
      HVAC_API_KEY: ${HVAC_API_KEY:-}
      SUPPLIER_API_URL: ${SUPPLIER_API_URL:-}
      SUPPLIER_API_KEY: ${SUPPLIER_API_KEY:-}
      FLIGHT_TRACKER_API_URL: ${FLIGHT_TRACKER_API_URL:-}
      FLIGHT_TRACKER_API_KEY: ${FLIGHT_TRACKER_API_KEY:-}
      BIOMETRIC_PROVIDER_URL: ${BIOMETRIC_PROVIDER_URL:-}
      BIOMETRIC_PROVIDER_API_KEY: ${BIOMETRIC_PROVIDER_API_KEY:-}
      SMART_LOCK_API_URL: ${SMART_LOCK_API_URL:-}
      SMART_LOCK_API_KEY: ${SMART_LOCK_API_KEY:-}
      CREDENTIAL_SIGNING_SECRET: ${CREDENTIAL_SIGNING_SECRET:-}
      APPLE_WALLET_BASE_URL: ${APPLE_WALLET_BASE_URL:-}
      GOOGLE_WALLET_BASE_URL: ${GOOGLE_WALLET_BASE_URL:-}
      LOCAL_HARDWARE_ENCRYPTION_KEY: ${LOCAL_HARDWARE_ENCRYPTION_KEY:-}
      EDGE_SYNC_API_KEY: ${EDGE_SYNC_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SLACK_OPERATIONS_WEBHOOK_URL: ${SLACK_OPERATIONS_WEBHOOK_URL:-}
      NETWORK_GATEWAY_URL: ${NETWORK_GATEWAY_URL:-}
      NETWORK_GATEWAY_API_KEY: ${NETWORK_GATEWAY_API_KEY:-}
      GUEST_WIFI_SSID: ${GUEST_WIFI_SSID:-Wyndham-Garden-Salina}
    ports:
      - "127.0.0.1:4010:4010"

  edge-sync:
    profiles: ["edge"]
    build: .
    restart: unless-stopped
    command: ["node", "dist/edge.js"]
    environment:
      EDGE_NODE_ID: ${EDGE_NODE_ID:?EDGE_NODE_ID is required}
      EDGE_SQLITE_PATH: /var/lib/aaiq-edge/edge.db
      EDGE_SYNC_API_URL: ${EDGE_SYNC_API_URL:?EDGE_SYNC_API_URL is required}
      EDGE_SYNC_API_KEY: ${EDGE_SYNC_API_KEY:?EDGE_SYNC_API_KEY is required}
      EDGE_LOCAL_API_KEY: ${EDGE_LOCAL_API_KEY:?EDGE_LOCAL_API_KEY is required}
      EDGE_BIND_HOST: ${EDGE_BIND_HOST:-127.0.0.1}
      EDGE_PORT: ${EDGE_PORT:-4020}
    volumes:
      - aaiq_edge:/var/lib/aaiq-edge

volumes:
  aaiq_postgres:
  aaiq_redis:
  aaiq_edge:
