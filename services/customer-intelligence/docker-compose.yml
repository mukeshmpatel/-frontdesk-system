services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://aaiq:aaiq@postgres:5432/aaiq_cdp
      REDIS_URL: redis://redis:6379/2
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      ACTIVATION_MODE: ${ACTIVATION_MODE:-DRY_RUN}
    ports: ["8080:8080"]
    depends_on: [postgres, redis]
  worker:
    build: .
    command: celery -A app.queue.celery_app worker -Q customer-intelligence --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+asyncpg://aaiq:aaiq@postgres:5432/aaiq_cdp
      REDIS_URL: redis://redis:6379/2
      ACTIVATION_MODE: ${ACTIVATION_MODE:-DRY_RUN}
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aaiq
      POSTGRES_PASSWORD: aaiq
      POSTGRES_DB: aaiq_cdp
    volumes: [cdp-postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [cdp-redis:/data]
volumes:
  cdp-postgres:
  cdp-redis:
