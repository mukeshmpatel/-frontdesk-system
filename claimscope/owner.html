<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClaimScope Owner Portal</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f8fa;color:#17202a}.wrap{max-width:1200px;margin:auto;padding:16px}.top,.card{background:#fff;border:1px solid #dfe5ea;border-radius:14px;padding:16px;margin-bottom:12px}h1{color:#17324d;margin:0 0 6px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cfd7df;border-radius:9px;font:inherit}.btn{padding:11px 14px;border:0;border-radius:9px;background:#17324d;color:#fff;font-weight:700}.muted{color:#66717c;font-size:13px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef3f7;margin:3px;font-size:12px;font-weight:700}.item{border-top:1px solid #e6ebef;padding:13px 0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.label{font-size:11px;text-transform:uppercase;font-weight:800;color:#73808c}.err{color:#a32626;font-weight:700}.ok{color:#21723f;font-weight:700}@media(max-width:760px){.row,.cols{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="top"><h1>ClaimScope Owner / Insured</h1><div class="muted">Private claim dashboard. Internal AI and strategy remain owner-only.</div><div class="row" style="margin-top:12px"><input id="token" placeholder="Owner access token"><input id="pin" maxlength="6" inputmode="numeric" placeholder="6-digit owner code"></div><button class="btn" id="open" style="margin-top:10px">Open Owner Dashboard</button><div id="msg" style="margin-top:10px"></div></section><section id="summary"></section><main id="list"></main></div><script>const API='https://zggmmqbyvxznmvqadvdk.supabase.co/functions/v1/claimscope-owner-api';const qp=new URLSearchParams(location.search);document.getElementById('token').value=qp.get('token')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('open').onclick=load;async function load(){const token=document.getElementById('token').value.trim(),pin=document.getElementById('pin').value.trim(),msg=document.getElementById('msg');msg.textContent='Loading…';try{const r=await fetch(API,{headers:{'x-owner-token':token,'x-owner-pin':pin}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to open');const items=d.items||[],responses=d.responses||[];const latest=new Map();responses.forEach(x=>{if(!latest.has(x.line_item_id))latest.set(x.line_item_id,x)});const counts={approved:0,partially_approved:0,denied:0,pending_review:0,needs_clarification:0,unanswered:0};items.forEach(i=>{const s=latest.get(i.id)?.status;s&&counts[s]!=null?counts[s]++:counts.unanswered++});document.getElementById('summary').innerHTML='<div class="card"><span class="pill">Total '+items.length+'</span><span class="pill">Approved '+counts.approved+'</span><span class="pill">Partial '+counts.partially_approved+'</span><span class="pill">Denied '+counts.denied+'</span><span class="pill">Under Review '+counts.pending_review+'</span><span class="pill">Need Info '+counts.needs_clarification+'</span><span class="pill">Unanswered '+counts.unanswered+'</span></div>';document.getElementById('list').innerHTML='<div class="card"><b>'+esc(d.label||'Owner Dashboard')+'</b>'+items.map(i=>{const rr=latest.get(i.id);return '<div class="item"><div class="muted">'+esc(i.item_id)+' · '+esc(i.category)+' · '+esc(i.area||'')+'</div><div class="cols"><div><div class="label">Carrier / J.S. Held Position</div><div>'+esc(i.jsh_description||'Not stated')+'</div></div><div><div class="label">Insured Supplemental Position</div><div>'+esc(i.insured_description||'Pending')+'</div></div></div><div style="margin-top:8px"><div class="label">Latest Reviewer Response</div><div>'+esc(rr?rr.status.replaceAll('_',' ')+' — '+(rr.explanation||'No explanation'):'No response yet')+'</div></div><div style="margin-top:8px"><div class="label">Owner-only AI Recommendation</div><div>'+esc(i.ai_recommendation||'No recommendation entered yet')+'</div></div></div>'}).join('')+'</div>';msg.textContent='Loaded';msg.className='ok'}catch(e){msg.textContent=e.message;msg.className='err'}}</script></body></html>
