<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClaimScope Owner</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f4f7fa;color:#17212b}header{background:#17324d;color:#fff;padding:16px 20px;position:sticky;top:0;z-index:5}.wrap{max-width:1250px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dce3e9;border-radius:14px;padding:16px;margin-bottom:14px}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.metric{background:#fff;border:1px solid #dce3e9;border-radius:12px;padding:12px}.metric b{display:block;font-size:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab{border:1px solid #ccd6df;background:#fff;padding:9px 12px;border-radius:9px;font-weight:700}.tab.active,.primary{background:#17324d;color:#fff;border-color:#17324d}.hide{display:none}.btn{border:1px solid #ccd6df;background:#fff;padding:8px 11px;border-radius:8px;font-weight:700}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px;border-bottom:1px solid #e6ebef;text-align:left;vertical-align:top}.table th{position:sticky;top:61px;background:#f8fafc}.pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#eef2f5;font-size:12px}.ok{background:#e7f6ed;color:#176536}.warn{background:#fff4d6;color:#7a5700}.bad{background:#fdeaea;color:#8d2020}.info{background:#e9f1fb;color:#1d4f86}input,textarea,select{width:100%;padding:9px;border:1px solid #cfd8e0;border-radius:8px;font:inherit}textarea{min-height:72px}.muted{color:#66717c;font-size:13px}.msg{font-size:13px;font-weight:700}.ai{border-left:4px solid #17324d;background:#f7faff;padding:10px;margin-top:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input{max-width:280px}@media(max-width:900px){.row{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:repeat(3,1fr)}.table{font-size:12px}}@media(max-width:600px){.row,.metrics{grid-template-columns:1fr 1fr}.wrap{padding:10px}header{position:static}.table th{position:static}}</style></head><body><header><b>ClaimScope — Owner / Insured</b></header><div class="wrap"><section id="gate" class="card"><h2>Secure Owner Access</h2><p class="muted">Enter the 6-digit owner access code.</p><div class="row"><input id="pin" maxlength="6" inputmode="numeric" placeholder="Access code"><button class="btn primary" id="open">Open Dashboard</button></div><p id="gateMsg" class="msg"></p></section><main id="app" class="hide"><div id="metrics" class="metrics"></div><div class="tabs"><button class="tab active" data-tab="scope">Scope</button><button class="tab" data-tab="invoices">Invoices</button><button class="tab" data-tab="payments">Payments</button><button class="tab" data-tab="depreciation">Depreciation</button></div><section id="scope" class="panel"></section><section id="invoices" class="panel hide"></section><section id="payments" class="panel hide"></section><section id="depreciation" class="panel hide"></section></main></div><script>const API='https://zggmmqbyvxznmvqadvdk.supabase.co/functions/v1/claimscope-owner-api';const token=new URLSearchParams(location.search).get('token')||'';let pin='',D={items:[],responses:[],invoices:[],payments:[],depreciation:[],contacts:[],evidence:[]};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0));async function api(method='GET',body){const r=await fetch(API,{method,headers:{'Content-Type':'application/json','x-owner-token':token,'x-owner-pin':pin},body:body?JSON.stringify(body):undefined});let x={};try{x=await r.json()}catch{}if(!r.ok)throw new Error(x.error||'Request failed');return x}function latestResp(id){return D.responses.find(r=>r.line_item_id===id)}function cls(s=''){s=String(s).toLowerCase();return s.includes('approved')&&!s.includes('partial')?'ok':s.includes('denied')?'bad':s.includes('partial')||s.includes('need')?'warn':'info'}function renderMetrics(){let statuses=D.items.map(i=>latestResp(i.id)?.status||'unanswered');let paid=D.payments.reduce((a,p)=>a+Number(p.amount||0),0),inv=D.invoices.reduce((a,i)=>a+Number(i.amount||0),0),held=D.depreciation.reduce((a,x)=>a+Number(x.depreciation_held||0),0),rec=D.depreciation.reduce((a,x)=>a+Number(x.depreciation_recovered||0),0);$('#metrics').innerHTML=[['Items',D.items.length],['Approved',statuses.filter(s=>s==='approved').length],['Open',statuses.filter(s=>!['approved','denied'].includes(s)).length],['Invoices',money(inv)],['Paid',money(paid)],['Deprec. Remaining',money(held-rec)]].map(x=>`<div class="metric"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('')}function renderScope(){let rows=D.items.map(i=>{let r=latestResp(i.id);return `<tr><td><b>${esc(i.item_id)}</b><br><span class="muted">${esc(i.category)} · ${esc(i.area||'')}</span></td><td>${esc(i.jsh_description||'')}</td><td>${esc(i.insured_description||'')}</td><td><span class="pill ${cls(r?.status)}">${esc((r?.status||'Unanswered').replaceAll('_',' '))}</span><br><span class="muted">${esc(r?.explanation||'')}</span></td><td><div class="ai"><b>Insured-only AI</b><br>${esc(i.ai_recommendation||'Review evidence, quantify variance, and request a line-specific written disposition.')}</div><button class="btn emailItem" data-id="${i.id}">Prepare Email</button></td></tr>`}).join('');$('#scope').innerHTML=`<div class="card"><div class="toolbar"><h2 style="margin-right:auto">Scope Reconciliation</h2><input id="q" placeholder="Search item, room or trade"></div><div style="overflow:auto"><table class="table"><thead><tr><th>Item</th><th>Carrier / J.S. Held</th><th>Our Supplemental Request</th><th>Latest Response</th><th>Owner Action</th></tr></thead><tbody id="scopeRows">${rows}</tbody></table></div></div>`;$('#q').oninput=e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('#scopeRows tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none')};document.querySelectorAll('.emailItem').forEach(b=>b.onclick=()=>prepareItemEmail(b.dataset.id))}function renderInvoices(){let rows=D.invoices.map(i=>{let paid=D.payments.filter(p=>p.invoice_id===i.id).reduce((a,p)=>a+Number(p.amount||0),0);return `<tr><td>${esc(i.invoice_number||'—')}</td><td>${esc(i.vendor_name||'')}</td><td>${money(i.amount)}</td><td><span class="pill ${cls(i.status)}">${esc(i.status)}</span><br>${esc(i.carrier_notes||'')}</td><td>${money(paid)}</td><td>${money(Number(i.amount||0)-paid)}</td><td><button class="btn invMail" data-id="${i.id}">Email</button></td></tr>`}).join('');$('#invoices').innerHTML=`<div class="card"><h2>Invoices</h2><div style="overflow:auto"><table class="table"><thead><tr><th>#</th><th>Vendor</th><th>Amount</th><th>Status</th><th>Paid</th><th>Balance</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="7">No invoices yet.</td></tr>'}</tbody></table></div></div><div class="card"><h3>Submit Invoice</h3><div class="row"><input id="invNo" placeholder="Invoice #"><input id="invVendor" placeholder="Vendor / payee"><input id="invAmount" type="number" step="0.01" placeholder="Amount"><input id="invDate" type="date"></div><textarea id="invDesc" placeholder="Description / linked work"></textarea><button class="btn primary" id="addInv">Save Invoice</button> <span id="invMsg" class="msg"></span></div>`;$('#addInv').onclick=addInvoice;document.querySelectorAll('.invMail').forEach(b=>b.onclick=()=>prepareInvoiceEmail(b.dataset.id))}function renderPayments(){let rows=D.payments.map(p=>{let inv=D.invoices.find(i=>i.id===p.invoice_id);return `<tr><td>${esc(inv?.invoice_number||'—')}</td><td>${esc(p.payment_date||'')}</td><td>${money(p.amount)}</td><td>${esc(p.check_number||p.reference_number||'')}</td><td>${esc(p.notes||'')}</td></tr>`}).join('');$('#payments').innerHTML=`<div class="card"><h2>Payments</h2><table class="table"><thead><tr><th>Invoice</th><th>Date</th><th>Amount</th><th>Check/Reference</th><th>Notes</th></tr></thead><tbody>${rows||'<tr><td colspan="5">No payments yet.</td></tr>'}</tbody></table></div><div class="card"><h3>Record Payment</h3><div class="row"><select id="payInv"><option value="">Select invoice</option>${D.invoices.map(i=>`<option value="${i.id}">${esc(i.invoice_number||i.vendor_name||i.id)}</option>`).join('')}</select><input id="payDate" type="date"><input id="payAmt" type="number" step="0.01" placeholder="Amount"><input id="payRef" placeholder="Check / reference"></div><textarea id="payNotes" placeholder="Notes"></textarea><button class="btn primary" id="addPay">Save Payment</button> <span id="payMsg" class="msg"></span></div>`;$('#addPay').onclick=addPayment}function renderDep(){let rows=D.depreciation.map(x=>`<tr><td>${esc(x.description||'')}</td><td>${money(x.replacement_cost_value)}</td><td>${money(x.actual_cash_value)}</td><td>${money(x.depreciation_held)}</td><td>${money(x.depreciation_recovered)}</td><td>${money(Number(x.depreciation_held||0)-Number(x.depreciation_recovered||0))}</td><td><span class="pill ${cls(x.status)}">${esc(x.status||'Pending')}</span><div class="ai">${esc(x.ai_recovery_suggestion||suggestDep(x))}</div></td></tr>`).join('');$('#depreciation').innerHTML=`<div class="card"><h2>Recoverable Depreciation</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Description</th><th>RCV</th><th>ACV</th><th>Withheld</th><th>Recovered</th><th>Remaining</th><th>Insured-only Recovery Guidance</th></tr></thead><tbody>${rows||'<tr><td colspan="7">No depreciation records yet.</td></tr>'}</tbody></table></div></div><div class="card"><h3>Add / Update Depreciation</h3><div class="row"><input id="depDesc" placeholder="Description"><input id="depRCV" type="number" step="0.01" placeholder="RCV"><input id="depACV" type="number" step="0.01" placeholder="ACV"><input id="depHeld" type="number" step="0.01" placeholder="Depreciation withheld"></div><div class="row"><input id="depRec" type="number" step="0.01" placeholder="Recovered to date"><input id="depDeadline" type="date"><select id="depStatus"><option>Pending</option><option>Proof Submitted</option><option>Recovery Requested</option><option>Partially Recovered</option><option>Recovered</option></select></div><textarea id="depNotes" placeholder="Recovery notes"></textarea><button class="btn primary" id="addDep">Save Depreciation</button> <span id="depMsg" class="msg"></span></div>`;$('#addDep').onclick=addDep}function suggestDep(x){let rem=Number(x.depreciation_held||0)-Number(x.depreciation_recovered||0);if(rem<=0)return'Recovered — retain proof of payment and close the record.';if(x.deadline&&new Date(x.deadline)-Date.now()<30*864e5)return'Deadline approaching: assemble paid invoices, proof of completion, prior carrier correspondence and send a written recovery request now.';return'Confirm completed work and paid invoices, tie them to the carrier estimate, submit proof of completion, and request release of recoverable depreciation in writing.'}async function load(){try{D=await api();$('#gate').classList.add('hide');$('#app').classList.remove('hide');renderMetrics();renderScope();renderInvoices();renderPayments();renderDep()}catch(e){$('#gateMsg').textContent=e.message}}async function addInvoice(){try{$('#invMsg').textContent='Saving…';await api('POST',{action:'create_invoice',invoice_number:$('#invNo').value,vendor_name:$('#invVendor').value,amount:Number($('#invAmount').value||0),invoice_date:$('#invDate').value||null,description:$('#invDesc').value});await load();switchTab('invoices')}catch(e){$('#invMsg').textContent=e.message}}async function addPayment(){try{$('#payMsg').textContent='Saving…';await api('POST',{action:'add_payment',invoice_id:$('#payInv').value||null,payment_date:$('#payDate').value||null,amount:Number($('#payAmt').value||0),check_number:$('#payRef').value,notes:$('#payNotes').value});await load();switchTab('payments')}catch(e){$('#payMsg').textContent=e.message}}async function addDep(){try{$('#depMsg').textContent='Saving…';let held=Number($('#depHeld').value||0),rec=Number($('#depRec').value||0),obj={action:'save_depreciation',description:$('#depDesc').value,replacement_cost_value:Number($('#depRCV').value||0),actual_cash_value:Number($('#depACV').value||0),depreciation_held:held,depreciation_recovered:rec,status:$('#depStatus').value,deadline:$('#depDeadline').value||null,recovery_notes:$('#depNotes').value,ai_recovery_suggestion:held-rec>0?'Confirm paid invoices and proof of completion, link them to the carrier estimate, request release in writing, and calendar the policy deadline.':''};await api('POST',obj);await load();switchTab('depreciation')}catch(e){$('#depMsg').textContent=e.message}}function recipients(){return D.contacts.filter(c=>c.side==='carrier'||c.side==='consultant').map(c=>c.email).filter(Boolean)}async function prepareItemEmail(id){let i=D.items.find(x=>x.id===id),r=latestResp(id),sub=`ClaimScope ${i.item_id} — response required`,body=`Claim item ${i.item_id} (${i.category} / ${i.area||''})\n\nCarrier/J.S. Held position:\n${i.jsh_description||''}\n\nOur supplemental request:\n${i.insured_description||''}\n\nLatest response: ${r?.status||'No response recorded'}\n${r?.explanation||''}\n\nPlease review the item and provide a line-specific written disposition.`;await logMail('line_item',id,sub,body);location.href=`mailto:${encodeURIComponent(recipients().join(','))}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`}async function prepareInvoiceEmail(id){let i=D.invoices.find(x=>x.id===id),paid=D.payments.filter(p=>p.invoice_id===id).reduce((a,p)=>a+Number(p.amount||0),0),sub=`ClaimScope Invoice ${i.invoice_number||''} — ${i.status}`,body=`Invoice: ${i.invoice_number||'N/A'}\nVendor: ${i.vendor_name||''}\nAmount: ${money(i.amount)}\nStatus: ${i.status}\nApproved amount: ${money(i.approved_amount)}\nPaid to date: ${money(paid)}\nOutstanding: ${money(Number(i.amount||0)-paid)}\n\nDescription:\n${i.description||''}\n\nCarrier notes:\n${i.carrier_notes||''}`;await logMail('invoice',id,sub,body);location.href=`mailto:${encodeURIComponent(recipients().join(','))}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`}async function logMail(t,id,subject,body){try{await api('POST',{action:'log_email',entity_type:t,entity_id:id,subject,body,recipients:recipients(),sent_via:'mailto'})}catch{}}function switchTab(id){document.querySelectorAll('.panel').forEach(x=>x.classList.add('hide'));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));$('#'+id).classList.remove('hide')}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$('#open').onclick=()=>{pin=$('#pin').value.trim();load()};$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('#open').click()});</script></body></html>
