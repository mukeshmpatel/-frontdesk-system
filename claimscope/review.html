<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClaimScope Reviewer Portal</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f8fa;color:#17202a}.wrap{max-width:1000px;margin:auto;padding:16px}.top,.card{background:#fff;border:1px solid #dfe5ea;border-radius:14px;padding:16px;margin-bottom:12px}h1{color:#17324d;margin:0 0 6px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cfd7df;border-radius:9px;font:inherit}.btn{padding:10px 12px;border:1px solid #cfd7df;border-radius:9px;background:#fff;font-weight:700}.primary{background:#17324d;color:#fff;border-color:#17324d}.choice.active{background:#e8f1fb;border-color:#17324d}.muted{color:#66717c;font-size:13px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef3f7;margin:3px;font-size:12px;font-weight:700}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.label{font-size:11px;text-transform:uppercase;font-weight:800;color:#73808c}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.msg{font-size:13px;font-weight:700}.ok{color:#21723f}.err{color:#a32626}@media(max-width:760px){.row,.cols{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="top"><h1>ClaimScope Review</h1><div class="muted">Review each disputed item and choose a response. No account setup is required.</div><div class="row" style="margin-top:12px"><input id="name" placeholder="Your name"><input id="org" placeholder="Organization"></div><div class="row" style="margin-top:10px"><input id="pin" maxlength="6" inputmode="numeric" placeholder="6-digit access code"><button id="open" class="btn primary">Open Review</button></div><div id="summary" style="margin-top:10px"></div></section><main id="list"><div class="card">Enter your access code to open the review.</div></main></div><script>const API='https://zggmmqbyvxznmvqadvdk.supabase.co/functions/v1/claimscope-reviewer';const token=new URLSearchParams(location.search).get('token')||'';let pin='',items=[];const labels={approved:'Approved',partially_approved:'Partially Approved',denied:'Denied',pending_review:'Under Review',needs_clarification:'Need More Information'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('open').onclick=load;async function load(){pin=document.getElementById('pin').value.trim();if(!token||!pin){document.getElementById('list').innerHTML='<div class="card err">Missing secure review token or access code.</div>';return}const r=await fetch(API+'?token='+encodeURIComponent(token),{headers:{'x-review-pin':pin}});let d={};try{d=await r.json()}catch{}if(!r.ok){document.getElementById('list').innerHTML='<div class="card err">'+esc(d.error||'Unable to open review')+'</div>';return}items=d.items||[];render()}function render(){const c={approved:0,partially_approved:0,denied:0,pending_review:0,needs_clarification:0,unanswered:0};items.forEach(i=>{const s=i.latest_response?.status;s&&c[s]!=null?c[s]++:c.unanswered++});document.getElementById('summary').innerHTML='<span class="pill">Total '+items.length+'</span><span class="pill">Approved '+c.approved+'</span><span class="pill">Partial '+c.partially_approved+'</span><span class="pill">Denied '+c.denied+'</span><span class="pill">Under Review '+c.pending_review+'</span><span class="pill">Need Info '+c.needs_clarification+'</span><span class="pill">Unanswered '+c.unanswered+'</span>';document.getElementById('list').innerHTML=items.map(i=>'<section class="card" data-id="'+i.id+'"><div class="muted">'+esc(i.item_id)+' · '+esc(i.category)+' · '+esc(i.area||'')+'</div><div class="cols" style="margin-top:10px"><div><div class="label">Carrier / J.S. Held Position</div><div>'+esc(i.jsh_description||'Not stated')+'</div></div><div><div class="label">Our Supplemental Request</div><div>'+esc(i.insured_description||'Pending')+'</div></div></div><div class="label" style="margin-top:14px">Your Response</div><div class="actions">'+Object.entries(labels).map(([v,l])=>'<button class="btn choice '+(i.latest_response?.status===v?'active':'')+'" data-v="'+v+'">'+l+'</button>').join('')+'</div><textarea class="why" rows="3" placeholder="Short explanation / information needed" style="margin-top:10px">'+esc(i.latest_response?.explanation||'')+'</textarea><div style="margin-top:10px"><button class="btn primary save">Save Response</button> <span class="msg"></span></div></section>').join('');document.querySelectorAll('.card[data-id]').forEach(card=>{let selected=items.find(x=>x.id===card.dataset.id)?.latest_response?.status||'';card.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{selected=b.dataset.v;card.querySelectorAll('.choice').forEach(x=>x.classList.toggle('active',x===b))});card.querySelector('.save').onclick=async()=>{const msg=card.querySelector('.msg');const why=card.querySelector('.why').value.trim();if(!selected){msg.textContent='Select a response first';msg.className='msg err';return}if(['partially_approved','denied','needs_clarification'].includes(selected)&&!why){msg.textContent='Please add a short explanation';msg.className='msg err';return}msg.textContent='Saving…';const r=await fetch(API+'?token='+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json','x-review-pin':pin},body:JSON.stringify({line_item_id:card.dataset.id,status:selected,explanation:why,reviewer_name:document.getElementById('name').value.trim(),reviewer_org:document.getElementById('org').value.trim()})});let d={};try{d=await r.json()}catch{}if(!r.ok){msg.textContent=d.error||'Save failed';msg.className='msg err';return}const it=items.find(x=>x.id===card.dataset.id);it.latest_response={status:selected,explanation:why,submitted_at:d.submitted_at};msg.textContent='Saved';msg.className='msg ok';}})}</script></body></html>
