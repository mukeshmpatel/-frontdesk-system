<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClaimScope Review</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f5f7fa;color:#17212b}.wrap{max-width:1050px;margin:auto;padding:14px}.top,.card{background:#fff;border:1px solid #dce3e9;border-radius:14px;padding:16px;margin-bottom:12px}.top{position:sticky;top:0;z-index:5}h2{margin:0;color:#17324d}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#66717c;font-size:13px}.label{font-size:11px;text-transform:uppercase;font-weight:800;color:#73808c;margin-bottom:5px}.btn{border:1px solid #ccd6df;background:#fff;padding:8px 10px;border-radius:8px;font-weight:700}.primary{background:#17324d;color:#fff;border-color:#17324d}.choice.active{background:#e8f1fb;border-color:#17324d}.actions{display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#eef2f5;font-size:12px;margin:2px}.hide{display:none}input,textarea,select{width:100%;padding:9px;border:1px solid #cfd8e0;border-radius:8px;font:inherit}textarea{min-height:70px}.msg{font-size:13px;font-weight:700}.ok{color:#176536}.err{color:#8d2020}.tabs{display:flex;gap:8px;margin:10px 0}.tab.active{background:#17324d;color:#fff}@media(max-width:720px){.row,.cols{grid-template-columns:1fr}.top{position:static}}</style></head><body><div class="wrap"><section class="top"><h2>ClaimScope Review</h2><p class="muted">Review each item and choose a clear disposition. No account creation or long email response is required.</p><div class="row"><input id="name" placeholder="Your name"><input id="org" placeholder="Organization"><input id="pin" maxlength="6" inputmode="numeric" placeholder="6-digit access code"></div><button id="open" class="btn primary" style="margin-top:9px">Open Review</button><span id="gateMsg" class="msg"></span><div id="summary"></div></section><main id="app" class="hide"><div class="tabs"><button class="btn tab active" data-tab="scope">Scope Items</button><button class="btn tab" data-tab="invoices">Invoices & Payments</button></div><section id="scope" class="panel"></section><section id="invoices" class="panel hide"></section></main></div><script>const API='https://zggmmqbyvxznmvqadvdk.supabase.co/functions/v1/claimscope-reviewer';const token=new URLSearchParams(location.search).get('token')||'';let pin='',D={items:[],invoices:[],payments:[],evidence:[]};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0));async function api(method='GET',body){const r=await fetch(API+'?token='+encodeURIComponent(token),{method,headers:{'Content-Type':'application/json','x-review-pin':pin},body:body?JSON.stringify(body):undefined});let x={};try{x=await r.json()}catch{}if(!r.ok)throw new Error(x.error||'Request failed');return x}const labels={approved:'Approved',partially_approved:'Partially Approved',denied:'Denied',pending_review:'Under Review',needs_clarification:'Need More Information'};async function load(){try{D=await api();$('#app').classList.remove('hide');$('#gateMsg').textContent='';render()}catch(e){$('#gateMsg').textContent=e.message;$('#gateMsg').className='msg err'}}function render(){let c={approved:0,partially_approved:0,denied:0,pending_review:0,needs_clarification:0,unanswered:0};D.items.forEach(i=>{let s=i.latest_response?.status;s&&c[s]!=null?c[s]++:c.unanswered++});$('#summary').innerHTML=Object.entries({Total:D.items.length,Approved:c.approved,Partial:c.partially_approved,Denied:c.denied,'Under Review':c.pending_review,'Need Info':c.needs_clarification,Unanswered:c.unanswered}).map(x=>`<span class="pill">${x[0]} ${x[1]}</span>`).join('');$('#scope').innerHTML=D.items.map(card).join('')||'<div class="card">No scope items.</div>';bindCards();renderInvoices()}function card(i){let s=i.latest_response?.status||'',ev=D.evidence.filter(e=>e.line_item_id===i.id);return `<section class="card" data-id="${i.id}"><b>${esc(i.item_id)} · ${esc(i.category)} · ${esc(i.area||'')}</b><div class="cols" style="margin-top:10px"><div><div class="label">Carrier / J.S. Held Position</div>${esc(i.jsh_description||'Not stated')}</div><div><div class="label">Our Supplemental Request</div>${esc(i.insured_description||'')}</div></div>${ev.length?`<div class="muted" style="margin-top:8px"><b>Evidence:</b> ${ev.map(e=>esc(e.file_name)).join(', ')}</div>`:''}<div class="label" style="margin-top:12px">Your Response</div><div class="actions">${Object.entries(labels).map(([v,l])=>`<button class="btn choice ${s===v?'active':''}" data-v="${v}">${l}</button>`).join('')}</div><textarea class="why" placeholder="Short explanation / information needed">${esc(i.latest_response?.explanation||'')}</textarea><button class="btn primary save">Save Response</button> <span class="msg"></span></section>`}function bindCards(){document.querySelectorAll('.card[data-id]').forEach(c=>{let i=D.items.find(x=>x.id===c.dataset.id),selected=i.latest_response?.status||'';c.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{selected=b.dataset.v;c.querySelectorAll('.choice').forEach(x=>x.classList.toggle('active',x===b))});c.querySelector('.save').onclick=async()=>{let msg=c.querySelector('.msg');try{msg.textContent='Saving…';await api('POST',{action:'line_response',line_item_id:c.dataset.id,status:selected,explanation:c.querySelector('.why').value,reviewer_name:$('#name').value,reviewer_org:$('#org').value});msg.textContent='Saved';msg.className='msg ok';await load()}catch(e){msg.textContent=e.message;msg.className='msg err'}}})}function renderInvoices(){let rows=D.invoices.map(i=>{let paid=D.payments.filter(p=>p.invoice_id===i.id).reduce((a,p)=>a+Number(p.amount||0),0);return `<div class="card" data-inv="${i.id}"><b>Invoice ${esc(i.invoice_number||'—')} · ${esc(i.vendor_name||'')}</b><div class="cols" style="margin-top:8px"><div><div class="label">Submitted Amount</div>${money(i.amount)}</div><div><div class="label">Paid to Date</div>${money(paid)}</div></div><div class="label" style="margin-top:10px">Invoice Disposition</div><select class="invStatus"><option>Under Review</option><option>Approved</option><option>Partially Approved</option><option>Denied</option><option>Need More Information</option></select><input class="approvedAmt" type="number" step="0.01" placeholder="Approved amount (if applicable)"><textarea class="invNotes" placeholder="Explanation / information needed">${esc(i.carrier_notes||'')}</textarea><button class="btn primary saveInv">Save Invoice Response</button><hr style="border:none;border-top:1px solid #e5eaee;margin:14px 0"><b>Record Payment</b><div class="row"><input class="payDate" type="date"><input class="payAmt" type="number" step="0.01" placeholder="Payment amount"><input class="payRef" placeholder="Check / reference #"></div><button class="btn payBtn" style="margin-top:8px">Save Payment</button> <span class="msg"></span></div>`}).join('');$('#invoices').innerHTML=rows||'<div class="card">No invoices submitted.</div>';document.querySelectorAll('[data-inv]').forEach(c=>{let i=D.invoices.find(x=>x.id===c.dataset.inv);c.querySelector('.invStatus').value=['Under Review','Approved','Partially Approved','Denied','Need More Information'].includes(i.status)?i.status:'Under Review';c.querySelector('.approvedAmt').value=i.approved_amount||'';c.querySelector('.saveInv').onclick=async()=>{let m=c.querySelector('.msg');try{await api('POST',{action:'invoice_response',invoice_id:i.id,status:c.querySelector('.invStatus').value,approved_amount:Number(c.querySelector('.approvedAmt').value||0),carrier_notes:c.querySelector('.invNotes').value});m.textContent='Invoice response saved';m.className='msg ok';await load()}catch(e){m.textContent=e.message;m.className='msg err'}};c.querySelector('.payBtn').onclick=async()=>{let m=c.querySelector('.msg');try{await api('POST',{action:'add_payment',invoice_id:i.id,payment_date:c.querySelector('.payDate').value||null,amount:Number(c.querySelector('.payAmt').value||0),check_number:c.querySelector('.payRef').value});m.textContent='Payment saved';m.className='msg ok';await load()}catch(e){m.textContent=e.message;m.className='msg err'}}})}function switchTab(id){document.querySelectorAll('.panel').forEach(x=>x.classList.add('hide'));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));$('#'+id).classList.remove('hide')}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$('#open').onclick=()=>{pin=$('#pin').value.trim();load()};$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('#open').click()});</script></body></html>
